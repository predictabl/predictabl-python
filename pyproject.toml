[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "predictabl"
dynamic = ["version"]
description = "Predictabl from Python: turn a question about your data into a trained model, then score it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Predictabl" }]
keywords = ["machine learning", "prediction", "forecasting", "automl", "tabular", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://predictabl.tech"
Documentation = "https://predictabl.tech/docs"
Source = "https://github.com/predictabl/predictabl-python"
Issues = "https://github.com/predictabl/predictabl-python/issues"

[project.scripts]
predictabl = "predictabl.__main__:main"

[tool.hatch.version]
path = "src/predictabl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/predictabl"]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.0", "mcp>=1.2", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Predictabl backend (PREDICTABL_TEST_URL)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
